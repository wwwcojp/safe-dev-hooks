[project]
name = "safe-dev-hooks"
version = "0.7.1"
description = "Claude Codeで安全に開発するためのHooks集"
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mutmut>=3.7",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["hooks"]
only_mutate = [
  "hooks/lib/patterns.py", "hooks/lib/hook_io.py", "hooks/lib/scanners.py", "hooks/lib/config.py",
  "hooks/lib/trust.py",
  "hooks/pre_tool_use/bash_guard.py",
]
also_copy = [
  "rules", "examples", ".claude-plugin", "scripts", ".github", "docs",
  "README.md", "README.ja.md", "CONTRIBUTING.md", ".claude-hooks.json", ".loop-hooks.json", ".gitignore",
]
